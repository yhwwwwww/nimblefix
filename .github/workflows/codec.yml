name: contracts
on: [push, pull_request]
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - toolchain: gcc
            cxx: g++
          - toolchain: clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.8'
      - name: Configure
        run: xmake f -y -m release --toolchain=${{ matrix.toolchain }} --benchmarks=y
      - name: Build and test
        run: xmake check
      - name: Installed consumers
        run: |
          ./build/linux/x86_64/release/install-test --root . --cxx "$CXX" --examples \
            --endpoint-test build/linux/x86_64/release/endpoint-test
          ./build/linux/x86_64/release/install-test --root . --cxx "$CXX" --core-only
      - name: Benchmark smoke
        run: |
          ./build/linux/x86_64/release/codec-bench 100 > /tmp/codec-smoke.csv
          ./build/linux/x86_64/release/session-bench 100 /tmp/session-smoke > /tmp/session-smoke.csv
          ./build/linux/x86_64/release/direct-initiator-bench 50 200
          ./build/linux/x86_64/release/acceptor-bench 50 200 2 epoll
          ./build/linux/x86_64/release/initiator-burst-bench --smoke
          ./build/linux/x86_64/release/quickfix-parity-bench 50 200 schemas/standard/FIX44.xml

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.8'
      - run: xmake f -y -m debug --toolchain=clang --sanitize=y --fuzzers=y
      - run: xmake check
      - name: Parser fuzz smoke
        run: xmake run parser-fuzz -runs=10000 -max_len=1024

  rhel:
    name: rhel (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: rhel8-gcc12
            image: almalinux:8
            toolset: gcc-toolset-12
          - label: rhel8-gcc14
            image: almalinux:8
            toolset: gcc-toolset-14
          - label: rhel9-gcc14
            image: almalinux:9
            toolset: gcc-toolset-14
    container:
      image: ${{ matrix.image }}
    env:
      XMAKE_ROOT: y
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install RHEL toolchain and dependencies
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            ${{ matrix.toolset }}-gcc-c++ \
            cmake make git tar gzip which util-linux \
            openssl openssl-devel libxml2-devel pkgconf-pkg-config
          echo "/opt/rh/${{ matrix.toolset }}/root/usr/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "CC=/opt/rh/${{ matrix.toolset }}/root/usr/bin/gcc" >> "$GITHUB_ENV"
          echo "CXX=/opt/rh/${{ matrix.toolset }}/root/usr/bin/g++" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rh/${{ matrix.toolset }}/root/usr/lib64:/opt/rh/${{ matrix.toolset }}/root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Build xmake 2.9.8 from source
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'
          mkdir -p /tmp/xmake-src
          curl -fsSL https://github.com/xmake-io/xmake/releases/download/v2.9.8/xmake-v2.9.8.tar.gz \
            | tar -xz -C /tmp/xmake-src
          (
            cd /tmp/xmake-src
            if [ -d xmake-2.9.8 ]; then cd xmake-2.9.8; fi
            ./configure
            make -j"$(nproc)"
            make install PREFIX=/usr/local
          )
          rm -rf /tmp/xmake-src
          xmake --version
          "$CXX" --version
          cmake --version
      - name: Configure
        run: xmake f -y -m release --toolchain=gcc --cc="$CC" --cxx="$CXX" --ld="$CXX" --benchmarks=y --tls=y --xml=y
      - name: Build and test
        run: xmake check
      - name: Installed consumers
        run: |
          ./build/linux/x86_64/release/install-test --root . --cxx "$CXX" --examples --features \
            --endpoint-test build/linux/x86_64/release/endpoint-test \
            --xmake-schema-test build/linux/x86_64/release/xmake_schema-test
          ./build/linux/x86_64/release/install-test --root . --cxx "$CXX" --core-only
      - name: Benchmark smoke
        run: |
          ./build/linux/x86_64/release/codec-bench 100 > /tmp/codec-smoke.csv
          ./build/linux/x86_64/release/session-bench 100 /tmp/session-smoke > /tmp/session-smoke.csv
          ./build/linux/x86_64/release/direct-initiator-bench 50 200
          ./build/linux/x86_64/release/acceptor-bench 50 200 2 epoll
          ./build/linux/x86_64/release/initiator-burst-bench --smoke
          ./build/linux/x86_64/release/quickfix-parity-bench 50 200 schemas/standard/FIX44.xml
